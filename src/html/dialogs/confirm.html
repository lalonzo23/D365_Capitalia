<!DOCTYPE html>
<!--
  Web resource: new_/html/dialogs/confirm.html
  Página HTML de ejemplo (diálogo). Abrir con Xrm.Navigation.openWebResource
  o como página de un panel.
-->
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmación</title>
    <!-- Si publicas el CSS como web resource, referencia su nombre completo: -->
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body>
    <main class="cap-dialog">
        <h1 class="cap-dialog__title">Confirmar acción</h1>
        <p class="cap-dialog__body">¿Deseas continuar con esta operación?</p>
        <div class="cap-dialog__actions">
            <button type="button" id="btnCancel" class="cap-btn cap-btn--secondary">Cancelar</button>
            <button type="button" id="btnConfirm" class="cap-btn cap-btn--primary">Aceptar</button>
        </div>
    </main>

    <script type="text/javascript">
        "use strict";
        document.getElementById("btnCancel").addEventListener("click", function () {
            window.close();
        });
        document.getElementById("btnConfirm").addEventListener("click", function () {
            // Acción de confirmación...
            window.close();
        });
    </script>
</body>
</html>
